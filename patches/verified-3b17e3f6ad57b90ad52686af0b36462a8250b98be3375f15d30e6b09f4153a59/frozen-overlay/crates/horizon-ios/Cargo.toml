[package]
name = "horizon-ios"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native iOS host for Horizon gameplay and terrain diagnostics"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
horizon-client = { path = "../horizon-client", default-features = false }
horizon-client-lib = { path = "../horizon-client-lib", default-features = false }
horizon-world = { path = "../horizon-world" }
horizon-core = { path = "../horizon-core" }
horizon-assets = { path = "../horizon-assets" }
horizon-threads = { path = "../horizon-threads" }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }
winit = { version = "0.30.13", default-features = false, features = ["rwh_06"] }
raw-window-handle = "0.6.2"
pollster = "0.4"
bytemuck = { version = "1.24", features = ["derive"] }
glam = "0.30"
serde_json = "1"
sha2 = "0.10.9"
log = "0.4"

[lints]
workspace = true

[[bin]]
name = "horizon-ios-fixture"
path = "../../tools/ios_terrain_fixture.rs"
