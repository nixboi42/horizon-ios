name: HorizonIOS
configFiles:
  Debug: Deployment.xcconfig
  Release: Deployment.xcconfig
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: dev.horizon.ios
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ARCHS: arm64
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: App/Info.plist
    OTHER_LDFLAGS: ["$(inherited)", "-lhorizon_ios", "-lc++", "-lresolv"]
    LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/../.local/ios-libs/$(PLATFORM_NAME)/$(CONFIGURATION)"]
targets:
  HorizonIOS:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
      - path: Resources/en.lproj
        type: folder
        buildPhase: resources
      - path: Resources/PreparedResources
        type: folder
        buildPhase: resources
    preBuildScripts:
      - name: Build Horizon Rust static library
        script: '"$SRCROOT/scripts/build-rust.sh"'
        basedOnDependencyAnalysis: false
    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: QuartzCore.framework
      - sdk: Metal.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreFoundation.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: GameController.framework
  HorizonIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: HorizonIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        TEST_TARGET_NAME: HorizonIOS
        PRODUCT_BUNDLE_IDENTIFIER: dev.horizon.ios.uitests
schemes:
  HorizonIOS:
    build:
      targets:
        HorizonIOS: all
    run:
      config: Debug
    test:
      config: Release
      targets: [HorizonIOSUITests]
